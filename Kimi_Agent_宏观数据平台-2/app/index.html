<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宏观经济数据平台</title>
    <style>
      /* 关键CSS：骨架屏样式 - 内联确保首屏立即可见 */
      *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
      html,body,#root{height:100%;width:100%}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f8fafc;color:#1e293b}
      .skeleton-container{display:flex;height:100vh;width:100vw;overflow:hidden}
      .skeleton-sidebar{width:240px;min-width:240px;background:#fff;border-right:1px solid #e2e8f0;padding:16px;display:flex;flex-direction:column;gap:4px}
      .skeleton-sidebar-collapsed{width:64px;min-width:64px}
      .skeleton-logo{height:36px;background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;border-radius:8px;margin-bottom:12px;animation:shimmer 1.5s infinite}
      .skeleton-nav-item{height:40px;background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;border-radius:6px;animation:shimmer 1.5s infinite}
      .skeleton-nav-item:nth-child(2){animation-delay:.1s}
      .skeleton-nav-item:nth-child(3){animation-delay:.2s}
      .skeleton-nav-item:nth-child(4){animation-delay:.3s}
      .skeleton-nav-item:nth-child(5){animation-delay:.4s}
      .skeleton-nav-item:nth-child(6){animation-delay:.5s}
      .skeleton-nav-item:nth-child(7){animation-delay:.6s}
      .skeleton-nav-item:nth-child(8){animation-delay:.7s}
      .skeleton-nav-item:nth-child(9){animation-delay:.8s}
      .skeleton-main{flex:1;display:flex;flex-direction:column;min-width:0}
      .skeleton-topbar{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
      .skeleton-topbar-title{height:20px;width:180px;background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;border-radius:4px;animation:shimmer 1.5s infinite}
      .skeleton-content{flex:1;padding:16px;overflow-y:auto}
      .skeleton-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:12px}
      .skeleton-card-title{height:18px;width:240px;background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;border-radius:4px;margin-bottom:12px;animation:shimmer 1.5s infinite}
      .skeleton-text{height:14px;background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;border-radius:4px;margin-bottom:8px;animation:shimmer 1.5s infinite}
      .skeleton-text:nth-child(2){width:95%;animation-delay:.05s}
      .skeleton-text:nth-child(3){width:90%;animation-delay:.1s}
      .skeleton-text:nth-child(4){width:85%;animation-delay:.15s}
      .skeleton-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
      .skeleton-grid-item{height:100px;background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;border-radius:8px;animation:shimmer 1.5s infinite}
      .skeleton-grid-item:nth-child(2){animation-delay:.1s}
      .skeleton-grid-item:nth-child(3){animation-delay:.2s}
      .skeleton-grid-item:nth-child(4){animation-delay:.3s}
      .skeleton-grid-item:nth-child(5){animation-delay:.4s}
      .skeleton-grid-item:nth-child(6){animation-delay:.5s}
      .skeleton-grid-item:nth-child(7){animation-delay:.6s}
      .skeleton-grid-item:nth-child(8){animation-delay:.7s}
      .skeleton-grid-item:nth-child(9){animation-delay:.8s}
      .skeleton-grid-item:nth-child(10){animation-delay:.9s}
      .skeleton-charts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
      .skeleton-chart{height:80px;background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;border-radius:6px;animation:shimmer 1.5s infinite}
      .skeleton-chart:nth-child(2){animation-delay:.1s}
      .skeleton-chart:nth-child(3){animation-delay:.2s}
      .skeleton-chart:nth-child(4){animation-delay:.3s}
      .skeleton-chart:nth-child(5){animation-delay:.4s}
      .skeleton-chart:nth-child(6){animation-delay:.5s}
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 静态骨架屏：JS加载前显示，确保用户立即看到页面框架 -->
      <div class="skeleton-container skeleton-root" id="skeleton">
        <div class="skeleton-sidebar">
          <div class="skeleton-logo"></div>
          <div class="skeleton-nav-item"></div>
          <div class="skeleton-nav-item"></div>
          <div class="skeleton-nav-item"></div>
          <div class="skeleton-nav-item"></div>
          <div class="skeleton-nav-item"></div>
          <div class="skeleton-nav-item"></div>
          <div class="skeleton-nav-item"></div>
          <div class="skeleton-nav-item"></div>
        </div>
        <div class="skeleton-main">
          <div class="skeleton-topbar">
            <div class="skeleton-topbar-title"></div>
          </div>
          <div class="skeleton-content">
            <div class="skeleton-card">
              <div class="skeleton-card-title"></div>
              <div class="skeleton-text"></div>
              <div class="skeleton-text"></div>
              <div class="skeleton-text"></div>
            </div>
            <div class="skeleton-card">
              <div class="skeleton-card-title"></div>
              <div class="skeleton-grid">
                <div class="skeleton-grid-item"></div>
                <div class="skeleton-grid-item"></div>
                <div class="skeleton-grid-item"></div>
                <div class="skeleton-grid-item"></div>
                <div class="skeleton-grid-item"></div>
                <div class="skeleton-grid-item"></div>
                <div class="skeleton-grid-item"></div>
                <div class="skeleton-grid-item"></div>
                <div class="skeleton-grid-item"></div>
                <div class="skeleton-grid-item"></div>
              </div>
            </div>
            <div class="skeleton-card">
              <div class="skeleton-card-title"></div>
              <div class="skeleton-charts">
                <div class="skeleton-chart"></div>
                <div class="skeleton-chart"></div>
                <div class="skeleton-chart"></div>
                <div class="skeleton-chart"></div>
                <div class="skeleton-chart"></div>
                <div class="skeleton-chart"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 如果5秒后JS还没加载完成，显示提示
      setTimeout(function() {
        var s = document.getElementById('skeleton');
        if (s && s.style.display !== 'none') {
          console.warn('页面加载较慢，请检查网络连接');
        }
      }, 5000);
    </script>
  </body>
</html>
