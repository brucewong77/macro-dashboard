name: 定时更新宏观经济数据

on:
  # ===== 定时触发 =====
  # 每天早上8点运行 (北京时间 UTC+8 = UTC 00:00)
  # cron 语法: 分 时 日 月 周 (UTC时间)
  schedule:
    - cron: '0 0 * * *'     # 每天 00:00 UTC = 08:00 北京时间
    # - cron: '0 0 * * 1'   # 每周一 08:00 (周一发周报场景)
    # - cron: '0 */6 * * *' # 每6小时一次

  # ===== 推送触发 =====
  # 推送到 main 分支时自动构建部署
  push:
    branches:
      - main

  # ===== 手动触发 =====
  # 在 GitHub 仓库页面点击 "Run workflow" 按钮即可手动运行
  workflow_dispatch:
    # 可添加输入参数
    inputs:
      data_source:
        description: '数据源选择'
        required: true
        default: 'akshare'
        type: choice
        options:
          - akshare
          - mock

# ===== 权限设置 =====
permissions:
  contents: read      # 读取仓库代码
  pages: write        # 写入 GitHub Pages
  id-token: write     # 用于 Pages 部署的身份验证
  actions: read       # 读取Artifact信息

# ===== 并发控制 =====
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ==========================
  # Job 1: 爬取数据 + 构建
  # ==========================
  update-and-build:
    name: 爬取数据并构建
    runs-on: ubuntu-latest

    steps:
      # Step 1: 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # Step 2: 设置 Python
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: 安装 Python 依赖
      - name: 安装数据爬取依赖
        run: |
          pip install akshare pandas
          echo "Python 依赖安装完成"

      # Step 4: 运行数据爬取脚本
      # ⚠️ 关键步骤：运行 Python 脚本，生成 public/data/macro_data.json
      # 自动调用AI生成指标点评（需在仓库Secrets中配置 LLM_API_KEY）
      - name: 爬取最新宏观经济数据
        id: fetch
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL || 'https://api.deepseek.com/v1/chat/completions' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: |
          python scripts/fetch_macro_data.py
          echo "=== 数据爬取结果 ==="
          ls -la public/data/
          echo "=== 数据文件内容预览 ==="
          cat public/data/macro_data.json | head -50

      # Step 5: 设置 Node.js
      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 6: 安装前端依赖
      - name: 安装 npm 依赖
        run: npm ci

      # Step 7: 构建项目
      # ⚠️ Vite 会自动将 public/ 目录下的文件复制到 dist/
      # 所以 public/data/macro_data.json 会被自动包含在构建产物中
      - name: Vite 构建
        run: npm run build

      # Step 8: 验证构建产物中包含数据文件
      - name: 验证数据文件
        run: |
          echo "=== dist/data/ 目录内容 ==="
          ls -la dist/data/ || echo "dist/data/ 目录不存在"
          if [ -f "dist/data/macro_data.json" ]; then
            echo "数据文件已成功包含在构建产物中"
            echo "文件大小: $(du -h dist/data/macro_data.json | cut -f1)"
          else
            echo "警告: 数据文件未在构建产物中"
            # 手动复制作为备用
            mkdir -p dist/data
            cp public/data/*.json dist/data/ 2>/dev/null || true
          fi

      # Step 9: 上传构建产物（供部署步骤使用）
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ==========================
  # Job 2: 部署到 GitHub Pages
  # ==========================
  deploy:
    name: 部署到 GitHub Pages
    # 依赖 Job 1 完成
    needs: update-and-build
    runs-on: ubuntu-latest

    # 环境配置（用于 GitHub Pages 部署）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
