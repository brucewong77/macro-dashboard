name: 构建并部署

on:
  # ===== 推送触发 =====
  push:
    branches:
      - main

  # ===== 手动触发 =====
  workflow_dispatch:

# ===== 权限设置 =====
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# ===== 并发控制 =====
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ==========================
  # Job 1: 构建
  # ==========================
  build:
    name: 构建项目
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建项目
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ==========================
  # Job 2: 部署
  # ==========================
  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
